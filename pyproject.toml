[project]
name = "fkjee"
version = "0.1.0"
description = "Find the smallest language model that can solve JEE Main questions."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.44",
  "peft>=0.12",
  "accelerate>=0.33",
  "datasets>=2.20",
  "huggingface_hub>=0.24",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.fkjee]
data-dir = "data"
runs-dir = "runs"
