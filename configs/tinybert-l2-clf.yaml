base: base.yaml
name: tinybert-l2-clf
track: ranker
model_id: cross-encoder/ms-marco-TinyBERT-L-2-v2
# ~4.4M total params: the smallest thing worth measuring.
# (prajjwal1/bert-tiny has the same size but ships no fast tokenizer.)
max_len: 384
epochs: 6
lr: 2.0e-5
head_lr: null          # pretrained ms-marco head: use the encoder LR
batch_size: 8
grad_accum: 2
eval_steps: 100

# Save every eval so load_best_model_at_end can reload the peak-dev model.
save_steps: 100
save_total_limit: 2
push_checkpoints: false   # only the selected best weights go to the Hub
